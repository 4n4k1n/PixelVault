name: release

on:
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o relaybot .
      - name: Update latest tag
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: relaybot